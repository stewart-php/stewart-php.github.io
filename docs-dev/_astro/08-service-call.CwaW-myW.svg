115.747" height="29.133" fill="#FCE8E6" style="stroke:#5F6368;stroke-width:0.5;" rx="4" ry="4"/><text x="782.599" y="694.418" fill="#202124" font-size="13" textLength="101.747" font-family="Helvetica">Home Assistant</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="10"><polygon points="249.883,102.563,259.883,106.563,249.883,110.563,253.883,106.563" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="29.698" y1="106.563" x2="255.883" y2="106.563" style="stroke:#5F6368;stroke-width:1;"/><text x="36.698" y="101.497" fill="#3C4043" font-size="13" textLength="208.184" font-family="Helvetica">callService('light','turn_on', [...])</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2" data-source-line="11"><polygon points="498.403,131.695,508.403,135.695,498.403,139.695,502.403,135.695" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.883" y1="135.695" x2="504.403" y2="135.695" style="stroke:#5F6368;stroke-width:1;"/><text x="268.883" y="130.629" fill="#3C4043" font-size="13" textLength="111.566" font-family="Helvetica">nextId() → "0:17"</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3" data-source-line="12"><polygon points="498.403,160.828,508.403,164.828,498.403,168.828,502.403,164.828" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.883" y1="164.828" x2="504.403" y2="164.828" style="stroke:#5F6368;stroke-width:1;"/><text x="268.883" y="159.762" fill="#3C4043" font-size="13" textLength="157.035" font-family="Helvetica">expect("0:17") → Future</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg4" data-source-line="13"><polygon points="600.244,189.961,610.244,193.961,600.244,197.961,604.244,193.961" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.883" y1="193.961" x2="606.244" y2="193.961" style="stroke:#5F6368;stroke-width:1;"/><text x="268.883" y="188.895" fill="#3C4043" font-size="13" textLength="141.426" font-weight="700" font-family="Helvetica">ServiceCallRequest</text><text x="414.441" y="188.895" fill="#3C4043" font-size="13" textLength="156.825" font-family="Helvetica">{ correlationId: "0:17" }</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg5" data-source-line="15"><line x1="261.883" y1="223.094" x2="303.883" y2="223.094" style="stroke:#5F6368;stroke-width:1;"/><line x1="303.883" y1="223.094" x2="303.883" y2="236.094" style="stroke:#5F6368;stroke-width:1;"/><line x1="262.883" y1="236.094" x2="303.883" y2="236.094" style="stroke:#5F6368;stroke-width:1;"/><polygon points="272.883,232.094,262.883,236.094,272.883,240.094,268.883,236.094" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="268.883" y="218.028" fill="#3C4043" font-size="13" textLength="234.521" font-family="Helvetica">future->await(TimeoutCancellation)</text></g><path d="M266.883,253.094 L266.883,315.094 A4,4 0 0 0 270.883,319.094 L577.883,319.094 A4,4 0 0 0 581.883,315.094 L581.883,259.094 L571.883,249.094 L270.883,249.094 A4,4 0 0 0 266.883,253.094" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M571.883,249.094 L571.883,257.094 A2,2 0 0 0 573.883,259.094 L581.883,259.094 L571.883,249.094" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="272.883" y="266.161" fill="#3C4043" font-size="13" textLength="63.127" font-family="Helvetica">The app's</text><text x="340.142" y="266.161" fill="#3C4043" font-size="13" textLength="146.148" font-weight="700" font-family="Helvetica">fiber suspends here</text><text x="486.291" y="266.161" fill="#3C4043" font-size="13" textLength="81.377" font-family="Helvetica">. The worker</text><text x="272.883" y="281.293" fill="#3C4043" font-size="13" textLength="288.177" font-family="Helvetica">process stays free to handle other events —</text><text x="272.883" y="296.426" fill="#3C4043" font-size="13" textLength="271.216" font-family="Helvetica">that suspension is the entire "reads like a</text><text x="272.883" y="311.559" fill="#3C4043" font-size="13" textLength="126.94" font-family="Helvetica">local call" property.</text><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg6" data-source-line="23"><line x1="612.244" y1="345.758" x2="654.244" y2="345.758" style="stroke:#5F6368;stroke-width:1;"/><line x1="654.244" y1="345.758" x2="654.244" y2="358.758" style="stroke:#5F6368;stroke-width:1;"/><line x1="613.244" y1="358.758" x2="654.244" y2="358.758" style="stroke:#5F6368;stroke-width:1;"/><polygon points="623.244,354.758,613.244,358.758,623.244,362.758,619.244,358.758" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="619.244" y="340.692" fill="#3C4043" font-size="13" textLength="192.486" font-family="Helvetica">record correlationId → worker</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg7" data-source-line="24"><polygon points="821.472,383.891,831.472,387.891,821.472,391.891,825.472,387.891" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="612.244" y1="387.891" x2="827.472" y2="387.891" style="stroke:#5F6368;stroke-width:1;"/><text x="619.244" y="382.825" fill="#3C4043" font-size="13" textLength="141.261" font-family="Helvetica">call_service { id: 42 }</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg8" data-source-line="25"><polygon points="623.244,413.023,613.244,417.023,623.244,421.023,619.244,417.023" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="617.244" y1="417.023" x2="832.472" y2="417.023" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="629.244" y="411.958" fill="#3C4043" font-size="13" textLength="197.228" font-family="Helvetica">result { id: 42, success: true }</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg9" data-source-line="27"><line x1="612.244" y1="446.156" x2="654.244" y2="446.156" style="stroke:#5F6368;stroke-width:1;"/><line x1="654.244" y1="446.156" x2="654.244" y2="459.156" style="stroke:#5F6368;stroke-width:1;"/><line x1="613.244" y1="459.156" x2="654.244" y2="459.156" style="stroke:#5F6368;stroke-width:1;"/><polygon points="623.244,455.156,613.244,459.156,623.244,463.156,619.244,459.156" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="619.244" y="441.09" fill="#3C4043" font-size="13" textLength="155.441" font-family="Helvetica">correlate id 42 → "0:17"</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg10" data-source-line="28"><polygon points="272.883,484.289,262.883,488.289,272.883,492.289,268.883,488.289" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="266.883" y1="488.289" x2="611.244" y2="488.289" style="stroke:#5F6368;stroke-width:1;"/><text x="278.883" y="483.223" fill="#3C4043" font-size="13" textLength="127.759" font-weight="700" font-family="Helvetica">ServiceCallResult</text><text x="410.774" y="483.223" fill="#3C4043" font-size="13" textLength="89.705" font-family="Helvetica">{ "0:17", ok }</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg11" data-source-line="29"><polygon points="498.403,513.422,508.403,517.422,498.403,521.422,502.403,517.422" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="261.883" y1="517.422" x2="504.403" y2="517.422" style="stroke:#5F6368;stroke-width:1;"/><text x="268.883" y="512.356" fill="#3C4043" font-size="13" textLength="98.668" font-family="Helvetica">resolve("0:17")</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg12" data-source-line="30"><polygon points="40.698,542.555,30.698,546.555,40.698,550.555,36.698,546.555" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="34.698" y1="546.555" x2="260.883" y2="546.555" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="46.698" y="541.489" fill="#3C4043" font-size="13" textLength="88.397" font-family="Helvetica">EventContext</text></g><path d="M559.615,563.555 L559.615,655.555 A4,4 0 0 0 563.615,659.555 L881.615,659.555 A4,4 0 0 0 885.615,655.555 L885.615,569.555 L875.615,559.555 L563.615,559.555 A4,4 0 0 0 559.615,563.555" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M875.615,559.555 L875.615,567.555 A2,2 0 0 0 877.615,569.555 L885.615,569.555 L875.615,559.555" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="565.615" y="576.622" fill="#3C4043" font-size="13" textLength="158.723" font-family="Helvetica">The broker must answer</text><text x="728.47" y="576.622" fill="#3C4043" font-size="13" textLength="40.993" font-weight="700" font-family="Helvetica">every</text><text x="773.596" y="576.622" fill="#3C4043" font-size="13" textLength="53.834" font-family="Helvetica">request,</text><text x="565.615" y="591.754" fill="#3C4043" font-size="13" textLength="292.868" font-family="Helvetica">including on failure or a dropped connection.</text><text x="565.615" y="606.887" fill="#3C4043" font-size="13" textLength="286.635" font-family="Helvetica">A missing reply is not a lost message — it is</text><text x="565.615" y="622.02" fill="#3C4043" font-size="13" textLength="305.487" font-family="Helvetica">a permanently suspended fiber with nothing in</text><text x="565.615" y="637.153" fill="#3C4043" font-size="13" textLength="259.537" font-family="Helvetica">the logs. The worker-side timeout is the</text><text x="565.615" y="652.286" fill="#3C4043" font-size="13" textLength="166.981" font-family="Helvetica">backstop for exactly that.</text><?plantuml-src RLHTQzj047pNhzWQWnqXcxOK2du8fA4bUIjje0-bX9EqjWwVxzIxbJy8XJxr1vJ-mloIpftan2vzaxHpkxCpStgXRMMwcYd8mV2yxJOc4os6wOe2-wskc2fbJ47ArhHh3gI5FAiwaD5h9aN6ePumMTOgBxhIhR92ewks7P4AfDgMnXsQLQxcSyWNvzViRzIriy9xIV1AzZJUfS8v-2FRMjlL9_xUSP2Gm6trV-mxx_0jGKeQb-dj777ZDjWn11q4xmdPA1etAiiYuTbb8h98YttkXPXEZ5urCYacqdbxx-oaeA_p-VpRHHQnE08w2xBOvBQUNj3ZhzyqUhbuzNPqLkTzovLC-qgF-j2X8nzH9K1vFWoznlnXvJod1wgSzsoKQ6TlwyNGdtvanyCzwsLgEBjKEwLbUgStx3gvLhPYqv-zoAmJ9XyN8hUCnpAYkuQZNPE0-KjTigVGXHQwGnpsdEVp11aK9sgzgpW4X4ST0YqzCuc3ZhP6W9pW3F6MhGHw_Fa7U6cK32q3I90E-CG4XFPCezDS0VsSh56SrBANmpm36uhSiwmyYkKPgjJdqYHT1w8927TxD--FkNuW3GNVl8PwACwUceNEo5En0DygBhaWyHr7fP_c7WSoiB7FYU7binV_M1cx9oTxP45kZQQd0G43PxPyJ4XVGp7cSa7lew33XSbw5zqMGfS5LXmyx0DFcou8xctOuJdFuOG_OBBlqrG0srz-N2g26Kkb3K93pkDMrz2xvQYfjKWh99q3VqKRZIi3lEVM7A9_891-0fYqWKfgnT7h-9VG0ISKmRQDik0C_90czEtJjTFIn0vDRAbjIWYZsIgS1cqMD7vGqeTuo0oWfQhMGLnBIp3clQhYX9Ymvupy1G00?></g></svg>