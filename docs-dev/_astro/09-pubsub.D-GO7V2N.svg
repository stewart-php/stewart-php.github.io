<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="SEQUENCE" style="width:1052px;height:631px;background:#FFFFFF;" width="1052px" height="631px" viewBox="0 0 1052 631" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="2"><text x="363.663" y="27.995" fill="#000" font-size="14" textLength="323.012" font-weight="700" font-family="Helvetica">App-to-app messaging, across processes</text></g><g><title>App A</title><rect x="47.174" y="92.563" width="8" height="482.258" fill="#000" fill-opacity="0"/><line x1="50.674" y1="92.563" x2="50.674" y2="574.82" style="stroke:#9AA0A6;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Worker 0</title><rect x="243.843" y="92.563" width="8" height="482.258" fill="#000" fill-opacity="0"/><line x1="247.343" y1="92.563" x2="247.343" y2="574.82" style="stroke:#9AA0A6;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Broker</title><rect x="442.797" y="92.563" width="8" height="482.258" fill="#000" fill-opacity="0"/><line x1="446.297" y1="92.563" x2="446.297" y2="574.82" style="stroke:#9AA0A6;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>Worker 1</title><rect x="731.533" y="92.563" width="8" height="482.258" fill="#000" fill-opacity="0"/><line x1="735.033" y1="92.563" x2="735.033" y2="574.82" style="stroke:#9AA0A6;stroke-width:0.5;stroke-dasharray:5,5;"/></g><g><title>App B</title><rect x="997.163" y="92.563" width="8" height="482.258" fill="#000" fill-opacity="0"/><line x1="1000.663" y1="92.563" x2="1000.663" y2="574.82" style="stroke:#9AA0A6;stroke-width:0.5;stroke-dasharray:5,5;"/></g><rect x="10" y="47.297" width="81.349" height="44.266" fill="#FEF7E0" style="stroke:#5F6368;stroke-width:0.5;" rx="4" ry="4"/><text x="31.463" y="66.364" fill="#202124" font-size="13" textLength="38.422" font-family="Helvetica">App A</text>