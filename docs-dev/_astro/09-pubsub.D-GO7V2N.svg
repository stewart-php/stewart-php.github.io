 font-size="13" textLength="43.088" font-family="Helvetica">Broker</text><rect x="698.319" y="574.82" width="73.427" height="29.133" fill="#E6F4EA" style="stroke:#5F6368;stroke-width:0.5;" rx="4" ry="4"/><text x="705.319" y="593.887" fill="#202124" font-size="13" textLength="59.427" font-family="Helvetica">Worker 1</text><rect x="959.988" y="574.82" width="81.349" height="44.266" fill="#FEF7E0" style="stroke:#5F6368;stroke-width:0.5;" rx="4" ry="4"/><text x="981.439" y="593.887" fill="#202124" font-size="13" textLength="38.448" font-family="Helvetica">App B</text><text x="966.988" y="609.02" fill="#202124" font-size="13" textLength="67.349" font-family="Helvetica">(worker 1)</text><rect x="10" y="121.129" width="1031.337" height="3" fill="#E8EAED" style="stroke:#E8EAED;stroke-width:1;" rx="4" ry="4"/><line x1="10" y1="121.129" x2="1041.337" y2="121.129" style="stroke:#5F6368;stroke-width:1;"/><line x1="10" y1="124.129" x2="1041.337" y2="124.129" style="stroke:#5F6368;stroke-width:1;"/><rect x="449.86" y="110.563" width="151.617" height="23.133" fill="#E8EAED" style="stroke:#5F6368;stroke-width:2;" rx="4" ry="4"/><text x="455.86" y="126.629" fill="#000" font-size="13" textLength="133.091" font-weight="700" font-family="Helvetica">subscribe, at boot</text><polygon points="746.033,160.828,736.033,164.828,746.033,168.828,742.033,164.828" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="740.033" y1="164.828" x2="999.663" y2="164.828" style="stroke:#5F6368;stroke-width:1;"/><text x="752.033" y="159.762" fill="#3C4043" font-size="13" textLength="241.63" font-family="Helvetica">watchTopic('house.*')->subscribe(...)</text><polygon points="457.297,189.961,447.297,193.961,457.297,197.961,453.297,193.961" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="451.297" y1="193.961" x2="734.033" y2="193.961" style="stroke:#5F6368;stroke-width:1;"/><text x="463.297" y="188.895" fill="#3C4043" font-size="13" textLength="72.357" font-weight="700" font-family="Helvetica">Subscribe</text><text x="539.787" y="188.895" fill="#3C4043" font-size="13" textLength="188.246" font-family="Helvetica">{ kind: Topic, glob selector }</text><rect x="10" y="222.527" width="1031.337" height="3" fill="#E8EAED" style="stroke:#E8EAED;stroke-width:1;" rx="4" ry="4"/><line x1="10" y1="222.527" x2="1041.337" y2="222.527" style="stroke:#5F6368;stroke-width:1;"/><line x1="10" y1="225.527" x2="1041.337" y2="225.527" style="stroke:#5F6368;stroke-width:1;"/><rect x="446.054" y="211.961" width="159.228" height="23.133" fill="#E8EAED" style="stroke:#5F6368;stroke-width:2;" rx="4" ry="4"/><text x="452.054" y="228.028" fill="#000" font-size="13" textLength="140.702" font-weight="700" font-family="Helvetica">publish, at runtime</text><polygon points="235.343,262.227,245.343,266.227,235.343,270.227,239.343,266.227" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="50.674" y1="266.227" x2="241.343" y2="266.227" style="stroke:#5F6368;stroke-width:1;"/><text x="57.674" y="261.161" fill="#3C4043" font-size="13" textLength="172.669" font-family="Helvetica">publish('house.away', [...])</text><polygon points="434.297,291.359,444.297,295.359,434.297,299.359,438.297,295.359" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.343" y1="295.359" x2="440.297" y2="295.359" style="stroke:#5F6368;stroke-width:1;"/><text x="254.343" y="290.293" fill="#3C4043" font-size="13" textLength="53.993" font-weight="700" font-family="Helvetica">Publish</text><text x="312.469" y="290.293" fill="#3C4043" font-size="13" textLength="116.829" font-family="Helvetica">{ topic, payload }</text><line x1="446.297" y1="324.492" x2="488.297" y2="324.492" style="stroke:#5F6368;stroke-width:1;"/><line x1="488.297" y1="324.492" x2="488.297" y2="337.492" style="stroke:#5F6368;stroke-width:1;"/><line x1="447.297" y1="337.492" x2="488.297" y2="337.492" style="stroke:#5F6368;stroke-width:1;"/><polygon points="457.297,333.492,447.297,337.492,457.297,341.492,453.297,337.492" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="453.297" y="319.426" fill="#3C4043" font-size="13" textLength="262.076" font-family="Helvetica">registry.findRoutes(Topic, 'house.away')</text><polygon points="723.033,362.625,733.033,366.625,723.033,370.625,727.033,366.625" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="446.297" y1="366.625" x2="729.033" y2="366.625" style="stroke:#5F6368;stroke-width:1;"/><text x="453.297" y="361.559" fill="#3C4043" font-size="13" textLength="103.391" font-weight="700" font-family="Helvetica">TopicMessage</text><text x="560.82" y="361.559" fill="#3C4043" font-size="13" textLength="130.501" font-family="Helvetica">{ event, deliverTo }</text><polygon points="988.663,391.758,998.663,395.758,988.663,399.758,992.663,395.758" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="735.033" y1="395.758" x2="994.663" y2="395.758" style="stroke:#5F6368;stroke-width:1;"/><text x="742.033" y="390.692" fill="#3C4043" font-size="13" textLength="216.855" font-family="Helvetica">handler(TopicEvent)  «own fiber»</text><path d="M294.86,412.758 L294.86,459.758 A4,4 0 0 0 298.86,463.758 L592.86,463.758 A4,4 0 0 0 596.86,459.758 L596.86,418.758 L586.86,408.758 L298.86,408.758 A4,4 0 0 0 294.86,412.758" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M586.86,408.758 L586.86,416.758 A2,2 0 0 0 588.86,418.758 L596.86,418.758 L586.86,408.758" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="300.86" y="425.825" fill="#3C4043" font-size="13" textLength="203.411" font-family="Helvetica">Unlike state changes, this goes</text><text x="508.403" y="425.825" fill="#3C4043" font-size="13" textLength="31.116" font-weight="700" font-family="Helvetica">only</text><text x="543.652" y="425.825" fill="#3C4043" font-size="13" textLength="13.051" font-family="Helvetica">to</text><text x="300.86" y="440.958" fill="#3C4043" font-size="13" textLength="281.874" font-family="Helvetica">workers holding a matching subscription —</text><text x="300.86" y="456.09" fill="#3C4043" font-size="13" textLength="243.502" font-family="Helvetica">there is no state cache to keep fresh.</text><path d="M15,478.156 L15,555.156 A4,4 0 0 0 19,559.156 L1032,559.156 A4,4 0 0 0 1036,555.156 L1036,484.156 L1026,474.156 L19,474.156 A4,4 0 0 0 15,478.156" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M1026,474.156 L1026,482.156 A2,2 0 0 0 1028,484.156 L1036,484.156 L1026,474.156" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="363.166" y="491.223" fill="#3C4043" font-size="13" textLength="282.49" font-family="Helvetica">Fire-and-forget by design. There is no reply</text><text x="363.166" y="506.356" fill="#3C4043" font-size="13" textLength="316.005" font-family="Helvetica">channel: an app needing an answer models it as</text><text x="363.166" y="521.489" fill="#3C4043" font-size="13" textLength="299.463" font-family="Helvetica">a second topic. Request/response would need</text><text x="363.166" y="536.622" fill="#3C4043" font-size="13" textLength="280.624" font-family="Helvetica">correlation, timeouts, and a deadlock story</text><text x="363.166" y="551.754" fill="#3C4043" font-size="13" textLength="216.379" font-family="Helvetica">for two apps that ask each other.</text><?plantuml-src RLFBQjj05DthAsv38BQmLMThOaC2xQvGqfGksYv6qhKqU3ntEZEA4ANGZ-WNzajwHh9h1xAJHkUUnvsZDzfMfgkPGXmC5wuxc2pgQ9ZkdLj6MIhdwC0Xg4RRPa6gyX82EIyL3ZbacLC-waexPIDTOOZklzbPBtxFdbRpArA155rtWNqbDR-4Vpd2HbI_ekjfxYNemGlEHaX9r-NuzYhDxKHp-pfDilPmjdOxMIlB2s_PPaEXAqFbTSd86gaKYRJPP80jjubwJRsALViaJbUpcrOmM-Gty-Ns_zoiA8fv1YW6Ik3p_DFfKvxJJzfhMwzf95XGOwIam8QhA9v-ZGvSLneTsb7VTpRg0oSBQdIm0kCHS99