th="115.747" height="29.133" fill="#FCE8E6" style="stroke:#5F6368;stroke-width:0.5;" rx="4" ry="4"/><text x="768.349" y="694.418" fill="#202124" font-size="13" textLength="101.747" font-family="Helvetica">Home Assistant</text></g><g class="message" data-entity-1="part1" data-entity-2="part2" id="msg1" data-source-line="10"><polygon points="235.632,102.563,245.632,106.563,235.632,110.563,239.632,106.563" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="29.698" y1="106.563" x2="241.632" y2="106.563" style="stroke:#5F6368;stroke-width:1;"/><text x="36.698" y="101.497" fill="#3C4043" font-size="13" textLength="193.934" font-family="Helvetica">callAction('light.turn_on', [...])</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg2" data-source-line="11"><polygon points="484.153,131.695,494.153,135.695,484.153,139.695,488.153,135.695" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.632" y1="135.695" x2="490.153" y2="135.695" style="stroke:#5F6368;stroke-width:1;"/><text x="254.632" y="130.629" fill="#3C4043" font-size="13" textLength="111.566" font-family="Helvetica">nextId() → "0:17"</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3" data-source-line="12"><polygon points="484.153,160.828,494.153,164.828,484.153,168.828,488.153,164.828" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.632" y1="164.828" x2="490.153" y2="164.828" style="stroke:#5F6368;stroke-width:1;"/><text x="254.632" y="159.762" fill="#3C4043" font-size="13" textLength="157.035" font-family="Helvetica">expect("0:17") → Future</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg4" data-source-line="13"><polygon points="585.994,189.961,595.994,193.961,585.994,197.961,589.994,193.961" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.632" y1="193.961" x2="591.994" y2="193.961" style="stroke:#5F6368;stroke-width:1;"/><text x="254.632" y="188.895" fill="#3C4043" font-size="13" textLength="134.005" font-weight="700" font-family="Helvetica">ActionCallRequest</text><text x="392.77" y="188.895" fill="#3C4043" font-size="13" textLength="156.825" font-family="Helvetica">{ correlationId: "0:17" }</text></g><g class="message" data-entity-1="part2" data-entity-2="part2" id="msg5" data-source-line="15"><line x1="247.632" y1="223.094" x2="289.632" y2="223.094" style="stroke:#5F6368;stroke-width:1;"/><line x1="289.632" y1="223.094" x2="289.632" y2="236.094" style="stroke:#5F6368;stroke-width:1;"/><line x1="248.632" y1="236.094" x2="289.632" y2="236.094" style="stroke:#5F6368;stroke-width:1;"/><polygon points="258.632,232.094,248.632,236.094,258.632,240.094,254.632,236.094" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="254.632" y="218.028" fill="#3C4043" font-size="13" textLength="234.521" font-family="Helvetica">future->await(TimeoutCancellation)</text></g><path d="M252.632,253.094 L252.632,315.094 A4,4 0 0 0 256.632,319.094 L563.632,319.094 A4,4 0 0 0 567.632,315.094 L567.632,259.094 L557.632,249.094 L256.632,249.094 A4,4 0 0 0 252.632,253.094" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M557.632,249.094 L557.632,257.094 A2,2 0 0 0 559.632,259.094 L567.632,259.094 L557.632,249.094" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="258.632" y="266.161" fill="#3C4043" font-size="13" textLength="63.127" font-family="Helvetica">The app's</text><text x="325.892" y="266.161" fill="#3C4043" font-size="13" textLength="146.148" font-weight="700" font-family="Helvetica">fiber suspends here</text><text x="472.04" y="266.161" fill="#3C4043" font-size="13" textLength="81.377" font-family="Helvetica">. The worker</text><text x="258.632" y="281.293" fill="#3C4043" font-size="13" textLength="288.177" font-family="Helvetica">process stays free to handle other events —</text><text x="258.632" y="296.426" fill="#3C4043" font-size="13" textLength="271.216" font-family="Helvetica">that suspension is the entire "reads like a</text><text x="258.632" y="311.559" fill="#3C4043" font-size="13" textLength="126.94" font-family="Helvetica">local call" property.</text><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg6" data-source-line="23"><line x1="597.994" y1="345.758" x2="639.994" y2="345.758" style="stroke:#5F6368;stroke-width:1;"/><line x1="639.994" y1="345.758" x2="639.994" y2="358.758" style="stroke:#5F6368;stroke-width:1;"/><line x1="598.994" y1="358.758" x2="639.994" y2="358.758" style="stroke:#5F6368;stroke-width:1;"/><polygon points="608.994,354.758,598.994,358.758,608.994,362.758,604.994,358.758" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="604.994" y="340.692" fill="#3C4043" font-size="13" textLength="192.486" font-family="Helvetica">record correlationId → worker</text></g><g class="message" data-entity-1="part4" data-entity-2="part5" id="msg7" data-source-line="24"><polygon points="807.222,383.891,817.222,387.891,807.222,391.891,811.222,387.891" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="597.994" y1="387.891" x2="813.222" y2="387.891" style="stroke:#5F6368;stroke-width:1;"/><text x="604.994" y="382.825" fill="#3C4043" font-size="13" textLength="141.261" font-family="Helvetica">call_service { id: 42 }</text></g><g class="message" data-entity-1="part5" data-entity-2="part4" id="msg8" data-source-line="25"><polygon points="608.994,413.023,598.994,417.023,608.994,421.023,604.994,417.023" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="602.994" y1="417.023" x2="818.222" y2="417.023" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="614.994" y="411.958" fill="#3C4043" font-size="13" textLength="197.228" font-family="Helvetica">result { id: 42, success: true }</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg9" data-source-line="27"><line x1="597.994" y1="446.156" x2="639.994" y2="446.156" style="stroke:#5F6368;stroke-width:1;"/><line x1="639.994" y1="446.156" x2="639.994" y2="459.156" style="stroke:#5F6368;stroke-width:1;"/><line x1="598.994" y1="459.156" x2="639.994" y2="459.156" style="stroke:#5F6368;stroke-width:1;"/><polygon points="608.994,455.156,598.994,459.156,608.994,463.156,604.994,459.156" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="604.994" y="441.09" fill="#3C4043" font-size="13" textLength="155.441" font-family="Helvetica">correlate id 42 → "0:17"</text></g><g class="message" data-entity-1="part4" data-entity-2="part2" id="msg10" data-source-line="28"><polygon points="258.632,484.289,248.632,488.289,258.632,492.289,254.632,488.289" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="252.632" y1="488.289" x2="596.994" y2="488.289" style="stroke:#5F6368;stroke-width:1;"/><text x="264.632" y="483.223" fill="#3C4043" font-size="13" textLength="120.339" font-weight="700" font-family="Helvetica">ActionCallResult</text><text x="389.103" y="483.223" fill="#3C4043" font-size="13" textLength="89.705" font-family="Helvetica">{ "0:17", ok }</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg11" data-source-line="29"><polygon points="484.153,513.422,494.153,517.422,484.153,521.422,488.153,517.422" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="247.632" y1="517.422" x2="490.153" y2="517.422" style="stroke:#5F6368;stroke-width:1;"/><text x="254.632" y="512.356" fill="#3C4043" font-size="13" textLength="98.668" font-family="Helvetica">resolve("0:17")</text></g><g class="message" data-entity-1="part2" data-entity-2="part1" id="msg12" data-source-line="30"><polygon points="40.698,542.555,30.698,546.555,40.698,550.555,36.698,546.555" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="34.698" y1="546.555" x2="246.632" y2="546.555" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="46.698" y="541.489" fill="#3C4043" font-size="13" textLength="88.397" font-family="Helvetica">EventContext</text></g><path d="M545.364,563.555 L545.364,655.555 A4,4 0 0 0 549.364,659.555 L867.364,659.555 A4,4 0 0 0 871.364,655.555 L871.364,569.555 L861.364,559.555 L549.364,559.555 A4,4 0 0 0 545.364,563.555" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M861.364,559.555 L861.364,567.555 A2,2 0 0 0 863.364,569.555 L871.364,569.555 L861.364,559.555" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="551.364" y="576.622" fill="#3C4043" font-size="13" textLength="158.723" font-family="Helvetica">The broker must answer</text><text x="714.22" y="576.622" fill="#3C4043" font-size="13" textLength="40.993" font-weight="700" font-family="Helvetica">every</text><text x="759.345" y="576.622" fill="#3C4043" font-size="13" textLength="53.834" font-family="Helvetica">request,</text><text x="551.364" y="591.754" fill="#3C4043" font-size="13" textLength="292.868" font-family="Helvetica">including on failure or a dropped connection.</text><text x="551.364" y="606.887" fill="#3C4043" font-size="13" textLength="286.635" font-family="Helvetica">A missing reply is not a lost message — it is</text><text x="551.364" y="622.02" fill="#3C4043" font-size="13" textLength="305.487" font-family="Helvetica">a permanently suspended fiber with nothing in</text><text x="551.364" y="637.153" fill="#3C4043" font-size="13" textLength="259.537" font-family="Helvetica">the logs. The worker-side timeout is the</text><text x="551.364" y="652.286" fill="#3C4043" font-size="13" textLength="166.981" font-family="Helvetica">backstop for exactly that.</text><?plantuml-src RLJBYjj04BphAph6i5vXYoG40ZuiE4l2xYs4G0uXB2EfRGqUpIWpBJy8WPpo0I5Vk5-Icf6yQqDkahgckxggHY-qhKnVCmKv6YwwlZMPQ35CAqkg4kqiLSgOEIbRqxuvaXRohEf0Hc-P51c7Ui9aMQUyw4ftoWfDLbqt8HL8THrD-y2-SZLVGhuulsL_fswT5Jv8WbToeEa-5Ix17zdMscu-yVUUWuG4xgh_OzzvXsy9KjAqJ6-NY3lNOiSGT12y9sIZQDgeB8k45pU9o38jjaewpAwCtZHIIE_jWxDNS_fQ5CMtwom2WGUN9LciSL_Fhkdnzn-Ql5o-UZkvgFEXuqfcGsL0VUZHaK-e4g0y7oRUOlQuRfxJ3wgSzsnKBDtNox4z_SnEPmV6wzHlSQFsIiliisxPzNAhRCLcE7kTMITCFcv3RXsFPKIV6uvMNGMCN-kIFOK-TD0Smh3dF2yIP5IRgFEkuX0G77KCjFRC90uQsXhXSO8pn3ks4kZnrr_WfL4ojWmnLJhW4nCGsZDDpZC5z7Eg9d5InrwEHGOs5BbdMNdIoZDKgI-bIRAEH1CGpWvEFY26ErqnnDHGyCrhg8VYugbPw8qy5UVWMyKbboI-vwZqqzpJG0OszZdpktpsujB9s3mPEG3dvBReUHuF471cnwTy33KKOoINz3xgETwLR33HxQ1pESU6euL3rgdjW-3AXZsUynn6-2Cc-o5CSs27Uu_xHF1YhRH1PiXvNEWQSdSS9RMM4_i2-1Mr6hS5UC-TEKRxG23TVqng8PBQSBGw_Y1qm0b5SArL5fo17yE4laEuzbgQsA69BRLD0M4qsuJpd2s2nhz9XWoFaG6qLDKsYEje3SPym7yA4sB0dYFo3m00?></g></svg>