.86,190.961" style="stroke:#5F6368;stroke-width:1.5;" fill="#E8EAED"/><rect x="298.86" y="190.961" width="462.92" height="85.531" fill="none" style="stroke:#5F6368;stroke-width:1.5;" rx="4" ry="4"/><text x="313.86" y="204.028" fill="#000" font-size="13" textLength="24.489" font-weight="700" font-family="Helvetica">par</text><text x="383.349" y="205.028" fill="#000" font-size="13" textLength="186.304" font-weight="700" font-family="Helvetica">[fan-out to every worker]</text><polygon points="546.597,235.359,556.597,239.359,546.597,243.359,550.597,239.359" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.86" y1="239.359" x2="552.597" y2="239.359" style="stroke:#5F6368;stroke-width:1;"/><text x="321.86" y="234.293" fill="#3C4043" font-size="13" textLength="136.183" font-weight="700" font-family="Helvetica">StateChangeBatch</text><text x="462.175" y="234.293" fill="#3C4043" font-size="13" textLength="79.422" font-family="Helvetica">{ changes }</text><polygon points="733.78,264.492,743.78,268.492,733.78,272.492,737.78,268.492" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.86" y1="268.492" x2="739.78" y2="268.492" style="stroke:#5F6368;stroke-width:1;"/><text x="321.86" y="263.426" fill="#3C4043" font-size="13" textLength="136.183" font-weight="700" font-family="Helvetica">StateChangeBatch</text><text x="462.175" y="263.426" fill="#3C4043" font-size="13" textLength="79.422" font-family="Helvetica">{ changes }</text><line x1="558.597" y1="311.625" x2="600.597" y2="311.625" style="stroke:#5F6368;stroke-width:1;"/><line x1="600.597" y1="311.625" x2="600.597" y2="324.625" style="stroke:#5F6368;stroke-width:1;"/><line x1="559.597" y1="324.625" x2="600.597" y2="324.625" style="stroke:#5F6368;stroke-width:1;"/><polygon points="569.597,320.625,559.597,324.625,569.597,328.625,565.597,324.625" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="565.597" y="306.559" fill="#3C4043" font-size="13" textLength="173.183" font-family="Helvetica">stateCache.applyChange()</text><line x1="745.78" y1="353.758" x2="787.78" y2="353.758" style="stroke:#5F6368;stroke-width:1;"/><line x1="787.78" y1="353.758" x2="787.78" y2="366.758" style="stroke:#5F6368;stroke-width:1;"/><line x1="746.78" y1="366.758" x2="787.78" y2="366.758" style="stroke:#5F6368;stroke-width:1;"/><polygon points="756.78,362.758,746.78,366.758,756.78,370.758,752.78,366.758" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="752.78" y="348.692" fill="#3C4043" font-size="13" textLength="173.183" font-family="Helvetica">stateCache.applyChange()</text><line x1="558.597" y1="411.023" x2="600.597" y2="411.023" style="stroke:#5F6368;stroke-width:1;"/><line x1="600.597" y1="411.023" x2="600.597" y2="424.023" style="stroke:#5F6368;stroke-width:1;"/><line x1="559.597" y1="424.023" x2="600.597" y2="424.023" style="stroke:#5F6368;stroke-width:1;"/><polygon points="569.597,420.023,559.597,424.023,569.597,428.023,565.597,424.023" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="565.597" y="390.825" fill="#3C4043" font-size="13" textLength="131.314" font-family="Helvetica">match subscriptions</text><text x="565.597" y="405.958" fill="#3C4043" font-size="13" textLength="75.156" font-weight="700" font-family="Helvetica">memoised</text><text x="644.885" y="405.958" fill="#3C4043" font-size="13" textLength="79.46" font-family="Helvetica">per entity id</text><path d="M596.108,441.023 L596.108,518.023 A4,4 0 0 0 600.108,522.023 L891.108,522.023 A4,4 0 0 0 895.108,518.023 L895.108,447.023 L885.108,437.023 L600.108,437.023 A4,4 0 0 0 596.108,441.023" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M885.108,437.023 L885.108,445.023 A2,2 0 0 0 887.108,447.023 L895.108,447.023 L885.108,437.023" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="602.108" y="454.09" fill="#3C4043" font-size="13" textLength="278.345" font-family="Helvetica">Worker 1 still updates its state cache even</text><text x="602.108" y="469.223" fill="#3C4043" font-size="13" textLength="254.7" font-family="Helvetica">though nothing there subscribed. A full</text><text x="602.108" y="484.356" fill="#3C4043" font-size="13" textLength="262.241" font-family="Helvetica">state cache can only stay fresh if it sees</text><text x="602.108" y="499.489" fill="#3C4043" font-size="13" textLength="40.993" font-weight="700" font-family="Helvetica">every</text><text x="647.233" y="499.489" fill="#3C4043" font-size="13" textLength="215.446" font-family="Helvetica">change — matching decides who</text><text x="602.108" y="514.622" fill="#3C4043" font-size="13" textLength="28.12" font-family="Helvetica">gets</text><text x="634.36" y="514.622" fill="#3C4043" font-size="13" textLength="24.915" font-style="italic" font-family="Helvetica">told</text><text x="659.275" y="514.622" fill="#3C4043" font-size="13" textLength="108.748" font-family="Helvetica">, never who gets</text><text x="772.155" y="514.622" fill="#3C4043" font-size="13" textLength="54.057" font-style="italic" font-family="Helvetica">updated</text><text x="826.212" y="514.622" fill="#3C4043" font-size="13" font-family="Helvetica">.</text><polygon points="920.963,544.82,930.963,548.82,920.963,552.82,924.963,548.82" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="558.597" y1="548.82" x2="926.963" y2="548.82" style="stroke:#5F6368;stroke-width:1;"/><text x="565.597" y="543.754" fill="#3C4043" font-size="13" textLength="228.89" font-family="Helvetica">handler(StateChange)  «own fiber»</text><path d="M937.963,565.82 L937.963,612.82 A4,4 0 0 0 941.963,616.82 L1243.963,616.82 A4,4 0 0 0 1247.963,612.82 L1247.963,571.82 L1237.963,561.82 L941.963,561.82 A4,4 0 0 0 937.963,565.82" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M1237.963,561.82 L1237.963,569.82 A2,2 0 0 0 1239.963,571.82 L1247.963,571.82 L1237.963,561.82" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="943.963" y="578.887" fill="#3C4043" font-size="13" textLength="259.384" font-family="Helvetica">Each subscription drains its queue in its</text><text x="943.963" y="594.02" fill="#3C4043" font-size="13" textLength="289.123" font-family="Helvetica">own fiber, so a handler that awaits a service</text><text x="943.963" y="609.153" fill="#3C4043" font-size="13" textLength="266.087" font-family="Helvetica">call holds back only its own subscription.</text><?plantuml-src ZLF1QXin5BplLxm67-p5iUEh2OOa57hleHU3aQMtbeWiRILj5XCA_OX-OR-a8wstTae2zSdxD6_cpUZfat7ITeefffFbHTiTRPLCiamFA8d49BLm1wR0GchZ3YGSYRQjgbQ4PAHfXKjqyyKVqH6ZGOzBDoGYQK4JBTx27eD_vb2EzpJPbw-tY6y-e4Pt1TFVqQGlXNT1gm6qUX_qqBPRDpME-ZFbhC0nEqswo45wnLM5AMyt66PD_C9eAvvtWsUrTQ-4eacddL5pybRjolcS7FV3N_fHxKU6hxdmX9Xu0HLxUYeiqrd9YXhXRdsNAFai5KxdkIh2hr30xPhgUc0fhOyYILtNz7g-X0Yr2tprFt1sggh0FFB7ZsO4tKZwCUR2SynQ5BjzbC6qoNWNjwwkZtpq9hB252qo7y8ZeohdaPM7RqZ0mtY3q3BMKjSgI4OoAOvRb-NBdG2TjEyEci1HDZ1f3ZngxrajiAjDPosGryqIc-gTFUNYYPh0KPDfe46HEG9Sr-KYCEjvnt___3KOoogAfL6OgTSUs0DZjEKoOGUMotp_nOhsuy7W06UB77aUbSVSyyQjyHoSiXocL_Sr8xg_zxsZ1Yx2PZE45Cn19_9DUML4dyK_EPCAmhWXg-yTTqpOSNm0-vThJj6J63KHc4WaUf5R1Do75oCPU2cGlOObF4SXduUqCYWJNMjUJFq1?></g></svg>