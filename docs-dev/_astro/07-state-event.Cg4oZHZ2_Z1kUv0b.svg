 x="321.86" y="176.028" fill="#3C4043" font-size="13" textLength="171.971" font-family="Helvetica">StateCache.applyUpdate()</text></g><path d="M302.86,206.094 L368.349,206.094 L368.349,213.227 L358.349,223.227 L298.86,223.227 L298.86,210.094 A4,4 0 0 1 302.86,206.094" style="stroke:#5F6368;stroke-width:1.5;" fill="#E8EAED"/><rect x="298.86" y="206.094" width="456.217" height="115.797" fill="none" style="stroke:#5F6368;stroke-width:1.5;" rx="4" ry="4"/><text x="313.86" y="219.161" fill="#000" font-size="13" textLength="24.489" font-weight="700" font-family="Helvetica">par</text><text x="383.349" y="220.161" fill="#000" font-size="13" textLength="186.304" font-weight="700" font-family="Helvetica">[fan-out to every worker]</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3" data-source-line="14"><polygon points="542.585,265.625,552.585,269.625,542.585,273.625,546.585,269.625" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.86" y1="269.625" x2="548.585" y2="269.625" style="stroke:#5F6368;stroke-width:1;"/><text x="321.86" y="249.426" fill="#3C4043" font-size="13" textLength="134.208" font-weight="700" font-family="Helvetica">StateUpdateBatch</text><text x="460.201" y="249.426" fill="#3C4043" font-size="13" textLength="77.384" font-family="Helvetica">{ updates }</text><text x="321.86" y="264.559" fill="#3C4043" font-size="13" textLength="95.564" font-family="Helvetica">new state only</text></g><g class="message" data-entity-1="part2" data-entity-2="part4" id="msg4" data-source-line="15"><polygon points="727.077,309.891,737.077,313.891,727.077,317.891,731.077,313.891" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="314.86" y1="313.891" x2="733.077" y2="313.891" style="stroke:#5F6368;stroke-width:1;"/><text x="321.86" y="293.692" fill="#3C4043" font-size="13" textLength="134.208" font-weight="700" font-family="Helvetica">StateUpdateBatch</text><text x="460.201" y="293.692" fill="#3C4043" font-size="13" textLength="77.384" font-family="Helvetica">{ updates }</text><text x="321.86" y="308.825" fill="#3C4043" font-size="13" textLength="95.564" font-family="Helvetica">new state only</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg5" data-source-line="18"><line x1="554.585" y1="372.156" x2="596.585" y2="372.156" style="stroke:#5F6368;stroke-width:1;"/><line x1="596.585" y1="372.156" x2="596.585" y2="385.156" style="stroke:#5F6368;stroke-width:1;"/><line x1="555.585" y1="385.156" x2="596.585" y2="385.156" style="stroke:#5F6368;stroke-width:1;"/><polygon points="565.585,381.156,555.585,385.156,565.585,389.156,561.585,385.156" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="561.585" y="351.958" fill="#3C4043" font-size="13" textLength="162.011" font-family="Helvetica">from = stateCache.find()</text><text x="561.585" y="367.09" fill="#3C4043" font-size="13" textLength="170.492" font-family="Helvetica">stateCache.applyUpdate()</text></g><g class="message" data-entity-1="part4" data-entity-2="part4" id="msg6" data-source-line="19"><line x1="739.077" y1="429.422" x2="781.077" y2="429.422" style="stroke:#5F6368;stroke-width:1;"/><line x1="781.077" y1="429.422" x2="781.077" y2="442.422" style="stroke:#5F6368;stroke-width:1;"/><line x1="740.077" y1="442.422" x2="781.077" y2="442.422" style="stroke:#5F6368;stroke-width:1;"/><polygon points="750.077,438.422,740.077,442.422,750.077,446.422,746.077,442.422" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="746.077" y="409.223" fill="#3C4043" font-size="13" textLength="162.011" font-family="Helvetica">from = stateCache.find()</text><text x="746.077" y="424.356" fill="#3C4043" font-size="13" textLength="170.492" font-family="Helvetica">stateCache.applyUpdate()</text></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg7" data-source-line="20"><line x1="554.585" y1="486.688" x2="596.585" y2="486.688" style="stroke:#5F6368;stroke-width:1;"/><line x1="596.585" y1="486.688" x2="596.585" y2="499.688" style="stroke:#5F6368;stroke-width:1;"/><line x1="555.585" y1="499.688" x2="596.585" y2="499.688" style="stroke:#5F6368;stroke-width:1;"/><polygon points="565.585,495.688,555.585,499.688,565.585,503.688,561.585,499.688" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="561.585" y="466.489" fill="#3C4043" font-size="13" textLength="131.314" font-family="Helvetica">match subscriptions</text><text x="561.585" y="481.622" fill="#3C4043" font-size="13" textLength="75.156" font-weight="700" font-family="Helvetica">memoised</text><text x="640.874" y="481.622" fill="#3C4043" font-size="13" textLength="79.46" font-family="Helvetica">per entity id</text></g><path d="M589.405,516.688 L589.405,593.688 A4,4 0 0 0 593.405,597.688 L884.405,597.688 A4,4 0 0 0 888.405,593.688 L888.405,522.688 L878.405,512.688 L593.405,512.688 A4,4 0 0 0 589.405,516.688" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M878.405,512.688 L878.405,520.688 A2,2 0 0 0 880.405,522.688 L888.405,522.688 L878.405,512.688" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="595.405" y="529.754" fill="#3C4043" font-size="13" textLength="278.345" font-family="Helvetica">Worker 1 still updates its state cache even</text><text x="595.405" y="544.887" fill="#3C4043" font-size="13" textLength="254.7" font-family="Helvetica">though nothing there subscribed. A full</text><text x="595.405" y="560.02" fill="#3C4043" font-size="13" textLength="262.241" font-family="Helvetica">state cache can only stay fresh if it sees</text><text x="595.405" y="575.153" fill="#3C4043" font-size="13" textLength="40.993" font-weight="700" font-family="Helvetica">every</text><text x="640.53" y="575.153" fill="#3C4043" font-size="13" textLength="215.446" font-family="Helvetica">change — matching decides who</text><text x="595.405" y="590.286" fill="#3C4043" font-size="13" textLength="28.12" font-family="Helvetica">gets</text><text x="627.657" y="590.286" fill="#3C4043" font-size="13" textLength="24.915" font-style="italic" font-family="Helvetica">told</text><text x="652.572" y="590.286" fill="#3C4043" font-size="13" textLength="108.748" font-family="Helvetica">, never who gets</text><text x="765.452" y="590.286" fill="#3C4043" font-size="13" textLength="54.057" font-style="italic" font-family="Helvetica">updated</text><text x="819.509" y="590.286" fill="#3C4043" font-size="13" font-family="Helvetica">.</text><g class="message" data-entity-1="part3" data-entity-2="part5" id="msg8" data-source-line="29"><polygon points="911.569,620.484,921.569,624.484,911.569,628.484,915.569,624.484" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="554.585" y1="624.484" x2="917.569" y2="624.484" style="stroke:#5F6368;stroke-width:1;"/><text x="561.585" y="619.418" fill="#3C4043" font-size="13" textLength="228.89" font-family="Helvetica">handler(StateChange)  «own fiber»</text></g><path d="M928.569,641.484 L928.569,688.484 A4,4 0 0 0 932.569,692.484 L1234.569,692.484 A4,4 0 0 0 1238.569,688.484 L1238.569,647.484 L1228.569,637.484 L932.569,637.484 A4,4 0 0 0 928.569,641.484" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M1228.569,637.484 L1228.569,645.484 A2,2 0 0 0 1230.569,647.484 L1238.569,647.484 L1228.569,637.484" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="934.569" y="654.551" fill="#3C4043" font-size="13" textLength="259.384" font-family="Helvetica">Each subscription drains its queue in its</text><text x="934.569" y="669.684" fill="#3C4043" font-size="13" textLength="289.123" font-family="Helvetica">own fiber, so a handler that awaits a service</text><text x="934.569" y="684.817" fill="#3C4043" font-size="13" textLength="266.087" font-family="Helvetica">call holds back only its own subscription.</text><?plantuml-src dLD1Rjim4Bph5Tl01rjmxFXgf0QIea3lHT6B0OCMLoOHcLH9Ae8G1EWZ-iA-f4FIYfqWlKGdSJcxipFS_QHDrNIIoOUXuKNR7PiYwD0mtI4a0bEbX3amEHQLqkP0mf1esw9eXGkwqgqmWQw-sIColDV8CU6AX2SbQAB4QzYzim_iqlMU9ljqUetuQHrYT9Cm_GrD-XHu5xJAeDNxeBkstPgfDjIVIiuI7BtJfFFiAYkvAD3bzGRDh8aV6Mb9yovhbblpH0ZgCEoqd9Djv2xTpybmdt_fkTYF5IJ7cXTtrZJ3rdoF_r_W7Yz0tWm_Med0T9Oif5gOQzi52ZPsu8PJkmNXIvLXmfhACbN9gVSYLAeiwOcwTFRql3LWfJFhHVhg8-biP560UUIldJtIvup8Kcfjv7IsDVv_wa0yqdya-ynzZFsIx_Q-SheDsXg_DMLvvAFLdYMKj7ZU_4waPM5iL04lGGuVnc41lMwQ5yqw-7708trwVg23ijr14MgaOG-A7O_SUvOBh4NTDGsGbyaLbYBw5eC3vB9Nf6jma6Vs09TbUbpqUbgdlx__P66H1OEZ9NhgbGNsm6XjkGmOj-KoZbgIeknuaHNWRX6VARRAurl5uLvZyunis4tpu2M-6T7jhUqDrL3XDfjiajC75SZMQQ69leetFfDqGflirQ-EEoQi4mx0ljIQaxSaHauO9WA9NiGK0VNkKLSCV2NWlO8aRBwe7h9R4HGBNNAUHVq3?></g></svg>