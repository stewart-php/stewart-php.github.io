4" font-family="Helvetica">exiting turns a clean stop into a</text><text x="499.427" y="448.223" fill="#3C4043" font-size="13" textLength="207.499" font-family="Helvetica">ContextException in the broker.</text><polygon points="476.427,478.422,486.427,482.422,476.427,486.422,480.427,482.422" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="224.231" y1="482.422" x2="482.427" y2="482.422" style="stroke:#5F6368;stroke-width:1;"/><text x="231.231" y="477.356" fill="#3C4043" font-size="13" textLength="145.666" font-family="Helvetica">join() until grace + 1 s</text><path d="M212.231,494.422 L272.674,494.422 L272.674,501.555 L262.674,511.555 L208.231,511.555 L208.231,498.422 A4,4 0 0 1 212.231,494.422" style="stroke:#5F6368;stroke-width:1.5;" fill="#E8EAED"/><rect x="208.231" y="494.422" width="296.195" height="106.664" fill="none" style="stroke:#5F6368;stroke-width:1.5;" rx="4" ry="4"/><text x="223.231" y="507.489" fill="#000" font-size="13" textLength="19.443" font-weight="700" font-family="Helvetica">alt</text><text x="287.674" y="508.489" fill="#000" font-size="13" textLength="132.165" font-weight="700" font-family="Helvetica">[returned in time]</text><polygon points="235.231,538.82,225.231,542.82,235.231,546.82,231.231,542.82" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="229.231" y1="542.82" x2="487.427" y2="542.82" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="241.231" y="537.754" fill="#3C4043" font-size="13" textLength="102.794" font-family="Helvetica">summary string</text><line x1="208.231" y1="551.82" x2="504.427" y2="551.82" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="213.231" y="565.887" fill="#000" font-size="13" textLength="112.918" font-weight="700" font-family="Helvetica">[grace expired]</text><polygon points="476.427,589.086,486.427,593.086,476.427,597.086,480.427,593.086" fill="#5F6368" 