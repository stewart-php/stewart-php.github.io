amily="Helvetica">stop probing and restarting workers</text></g><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg3" data-source-line="13"><polygon points="476.427,188.961,486.427,192.961,476.427,196.961,480.427,192.961" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="224.231" y1="192.961" x2="482.427" y2="192.961" style="stroke:#5F6368;stroke-width:1;"/><text x="231.231" y="187.895" fill="#3C4043" font-size="13" textLength="73.588" font-weight="700" font-family="Helvetica">Shutdown</text><text x="308.952" y="187.895" fill="#3C4043" font-size="13" textLength="114.055" font-family="Helvetica">{ reason, grace }</text></g><g class="message" data-entity-1="part3" data-entity-2="part4" id="msg4" data-source-line="14"><polygon points="607.871,218.094,617.871,222.094,607.871,226.094,611.871,222.094" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="488.427" y1="222.094" x2="613.871" y2="222.094" style="stroke:#5F6368;stroke-width:1;"/><text x="495.427" y="217.028" fill="#3C4043" font-size="13" textLength="59.757" font-family="Helvetica">dispose()</text></g><g class="message" data-entity-1="part4" data-entity-2="part3" id="msg5" data-source-line="15"><polygon points="499.427,232.094,489.427,236.094,499.427,240.094,495.427,236.094" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="493.427" y1="236.094" x2="618.871" y2="236.094" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/></g><g class="message" data-entity-1="part3" data-entity-2="part3" id="msg6" data-source-line="16"><line x1="488.427" y1="280.359" x2="530.427" y2="280.359" style="stroke:#5F6368;stroke-width:1;"/><line x1="530.427" y1="280.359" x2="530.427" y2="293.359" style="stroke:#5F6368;stroke-width:1;"/><line x1="489.427" y1="293.359" x2="530.427" y2="293.359" style="stroke:#5F6368;stroke-width:1;"/><polygon points="499.427,289.359,489.427,293.359,499.427,297.359,495.427,293.359" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="495.427" y="260.161" fill="#3C4043" font-size="13" textLength="96.065" font-family="Helvetica">fail all pending</text><text x="495.427" y="275.293" fill="#3C4043" font-size="13" textLength="117.444" font-family="Helvetica">action-call futures</text></g><path d="M493.427,310.359 L493.427,342.359 A4,4 0 0 0 497.427,346.359 L783.427,346.359 A4,4 0 0 0 787.427,342.359 L787.427,316.359 L777.427,306.359 L497.427,306.359 A4,4 0 0 0 493.427,310.359" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M777.427,306.359 L777.427,314.359 A2,2 0 0 0 779.427,316.359 L787.427,316.359 L777.427,306.359" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="499.427" y="323.426" fill="#3C4043" font-size="13" textLength="240.729" font-family="Helvetica">Anything still awaiting a result would</text><text x="499.427" y="338.559" fill="#3C4043" font-size="13" textLength="273.679" font-family="Helvetica">otherwise hang a fiber through shutdown.</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg7" data-source-line="22"><polygon points="235.231,368.758,225.231,372.758,235.231,376.758,231.231,372.758" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="229.231" y1="372.758" x2="487.427" y2="372.758" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="241.231" y="367.692" fill="#3C4043" font-size="13" textLength="54.101" font-weight="700" font-family="Helvetica">returns</text><text x="299.465" y="367.692" fill="#3C4043" font-size="13" textLength="181.962" font-family="Helvetica">from the entrypoint callable</text></g><path d="M493.427,389.758 L493.427,451.758 A4,4 0 0 0 497.427,455.758 L801.427,455.758 A4,4 0 0 0 805.427,451.758 L805.427,395.758 L795.427,385.758 L497.427,385.758 A4,4 0 0 0 493.427,389.758" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><path d="M795.427,385.758 L795.427,393.758 A2,2 0 0 0 797.427,395.758 L805.427,395.758 L795.427,385.758" style="stroke:#B8860B;stroke-width:0.5;" fill="#FEF7E0"/><text x="499.427" y="402.825" fill="#3C4043" font-size="13" textLength="291.999" font-family="Helvetica">Returning, never exit(). The result channel is</text><text x="499.427" y="417.958" fill="#3C4043" font-size="13" textLength="266.69" font-family="Helvetica">written only after the callable returns, so</text><text x="499.427" y="433.09" fill="#3C4043" font-size="13" textLength="206.864" font-family="Helvetica">exiting turns a clean stop into a</text><text x="499.427" y="448.223" fill="#3C4043" font-size="13" textLength="207.499" font-family="Helvetica">ContextException in the broker.</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg8" data-source-line="30"><polygon points="476.427,478.422,486.427,482.422,476.427,486.422,480.427,482.422" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="224.231" y1="482.422" x2="482.427" y2="482.422" style="stroke:#5F6368;stroke-width:1;"/><text x="231.231" y="477.356" fill="#3C4043" font-size="13" textLength="145.666" font-family="Helvetica">join() until grace + 1 s</text></g><path d="M212.231,494.422 L272.674,494.422 L272.674,501.555 L262.674,511.555 L208.231,511.555 L208.231,498.422 A4,4 0 0 1 212.231,494.422" style="stroke:#5F6368;stroke-width:1.5;" fill="#E8EAED"/><rect x="208.231" y="494.422" width="296.195" height="106.664" fill="none" style="stroke:#5F6368;stroke-width:1.5;" rx="4" ry="4"/><text x="223.231" y="507.489" fill="#000" font-size="13" textLength="19.443" font-weight="700" font-family="Helvetica">alt</text><text x="287.674" y="508.489" fill="#000" font-size="13" textLength="132.165" font-weight="700" font-family="Helvetica">[returned in time]</text><g class="message" data-entity-1="part3" data-entity-2="part2" id="msg9" data-source-line="32"><polygon points="235.231,538.82,225.231,542.82,235.231,546.82,231.231,542.82" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="229.231" y1="542.82" x2="487.427" y2="542.82" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="241.231" y="537.754" fill="#3C4043" font-size="13" textLength="102.794" font-family="Helvetica">summary string</text></g><line x1="208.231" y1="551.82" x2="504.427" y2="551.82" style="stroke:#5F6368;stroke-width:1;stroke-dasharray:2,2;"/><text x="213.231" y="565.887" fill="#000" font-size="13" textLength="112.918" font-weight="700" font-family="Helvetica">[grace expired]</text><g class="message" data-entity-1="part2" data-entity-2="part3" id="msg10" data-source-line="34"><polygon points="476.427,589.086,486.427,593.086,476.427,597.086,480.427,593.086" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="224.231" y1="593.086" x2="482.427" y2="593.086" style="stroke:#5F6368;stroke-width:1;"/><text x="231.231" y="588.02" fill="#3C4043" font-size="13" textLength="150.973" font-family="Helvetica">context->close()  «kill»</text></g><g class="message" data-entity-1="part2" data-entity-2="part5" id="msg11" data-source-line="37"><polygon points="695.443,632.219,705.443,636.219,695.443,640.219,699.443,636.219" fill="#5F6368" style="stroke:#5F6368;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line x1="224.231" y1="636.219" x2="701.443" y2="636.219" style="stroke:#5F6368;stroke-width:1;"/><text x="231.231" y="631.153" fill="#3C4043" font-size="13" textLength="110.697" font-family="Helvetica">close WebSocket</text></g><?plantuml-src RPB1Rjim38RlUWgco279aWox5aM0R2Yw7hP3Kw2NNcIPZhN8b23HSu9XxpvADe86sCqqVv8VVsfcoRY-HaXySRWDVUSKMtO8Jr4RR7e7gUsvzWCf5NHaQspGn71tU7vwVNpvyKwVGJwVVxxUWKwGxF5MzZNw4yQIgs1UbUXMyUQZ_8DJqGmm7qfygzc7KD8w19Zt2QFnDTvAlliEOP-IJInnKRSQvgrMIg1WivFvzvcFj8C58TO9